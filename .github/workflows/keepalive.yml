name: Keep app awake

# Streamlit Community Cloud sleeps apps with no viewers for ~12h. A plain HTTP ping doesn't count
# (activity is a live websocket session), so open the app in a real headless browser instead.
# Set the repo variable APP_URL (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Open the app (wake it if asleep)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          python - <<'PY'
          import os, sys
          from playwright.sync_api import sync_playwright

          url = os.environ.get("APP_URL")
          if not url:
              sys.exit("APP_URL repo variable is not set")

          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, wait_until="domcontentloaded")
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              try:
                  wake.wait_for(timeout=15_000)
                  print("App was asleep; waking it")
                  wake.click()
              except Exception:
                  print("App already awake")
              # Fails the job (and sends GitHub's failure email) if the app never renders.
              page.wait_for_selector('[data-testid="stApp"]', timeout=120_000)
              page.wait_for_timeout(10_000)  # let the websocket session establish
              print("App loaded:", page.title())
          PY
